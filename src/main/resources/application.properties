spring.application.name=ProyectoBD2

# Cargar variables del archivo .env
spring.config.import=optional:file:.env[.properties]

# Conexion a PostgreSQL - Neon
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver de PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Puerto del servidor
server.port=${PORT:8080}

# Token JWT
jwt.secreto=${JWT_SECRET}
jwt.expiracion-horas=${JWT_EXPIRACION_HORAS:8}

# CORS: en local acepta cualquier localhost
app.cors.origenes=${CORS_ORIGENES:http://localhost:*}